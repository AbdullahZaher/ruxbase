# The benchmark environment (see bench/run.sh).
#
# All services run in the same Docker network with CPU limits:
#   - pocketbase: PocketBase v0.40.6 (SQLite), 2 CPUs;
#   - ruxbase: a single ruxbase instance, 2 CPUs, with the shared Postgres;
#   - node1..node3: 3 ruxbase instances (2 CPUs each) with the realtime
#     replication source (the load generator spreads the requests over them);
#   - postgres: Postgres 18, 4 CPUs (the "single" and "cluster" databases);
#   - runner: the load generator, 4 CPUs.
#
# The binaries are built by run.sh into bench/.bin.
name: ruxbase-bench

x-app: &app
  image: ${BENCH_BASE_IMAGE:-debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2}
  entrypoint: []
  deploy:
    resources:
      limits:
        cpus: "2"
        memory: 2g

x-ruxbase: &ruxbase
  <<: *app
  command: [ "/bench/ruxbase", "serve", "--http=0.0.0.0:8090", "--dir=/data", "--dev=false" ]
  depends_on:
    - postgres

services:
  postgres:
    image: ${BENCH_POSTGRES_IMAGE:-pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa}
    command: >
      postgres -c wal_level=logical -c max_connections=400 -c shared_buffers=1GB -c effective_cache_size=2GB
    environment:
      POSTGRES_PASSWORD: bench
    deploy:
      resources:
        limits:
          cpus: "${BENCH_POSTGRES_CPUS:-4}"
          memory: 4g

  pocketbase:
    <<: *app
    command: [ "/bench/pocketbase", "serve", "--http=0.0.0.0:8090", "--dir=/data" ]
    volumes:
      - ./.bin:/bench:ro
      - pb_data:/data

  ruxbase:
    <<: *ruxbase
    environment:
      DATABASE_URL: postgres://postgres:bench@postgres:5432/single?sslmode=disable
    volumes:
      - ./.bin:/bench:ro
      - ruxbase_data:/data

  node1: &node
    <<: *ruxbase
    environment:
      DATABASE_URL: postgres://postgres:bench@postgres:5432/cluster?sslmode=disable
      RUXBASE_REALTIME_SOURCE: replication
    volumes:
      - ./.bin:/bench:ro
      - node1_data:/data
  node2:
    <<: *node
    volumes:
      - ./.bin:/bench:ro
      - node2_data:/data
  node3:
    <<: *node
    volumes:
      - ./.bin:/bench:ro
      - node3_data:/data

  runner:
    <<: *app
    command: [ "sleep", "infinity" ]
    volumes:
      - ./.bin:/bench:ro
    deploy:
      resources:
        limits:
          cpus: "${BENCH_RUNNER_CPUS:-4}"
          memory: 2g

volumes:
  pb_data:
  ruxbase_data:
  node1_data:
  node2_data:
  node3_data:
