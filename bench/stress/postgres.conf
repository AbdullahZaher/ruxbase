# Production-like PostgreSQL 17/18 configuration for Ruxbase Enterprise Stress Testing.
# Tuned for isolated container resources (2.0-2.5 CPUs, 3.0-3.5 GiB RAM).

listen_addresses = '*'
max_connections = 300

# Memory
shared_buffers = 1GB
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 256MB

# WAL & Logical Replication
wal_level = logical
max_replication_slots = 10
max_wal_senders = 10
max_slot_wal_keep_size = 1GB
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9

# Planner & I/O
random_page_cost = 1.1
effective_io_concurrency = 100

# Observability & Contention Diagnostics
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = all
track_io_timing = on
track_activities = on
track_counts = on
log_lock_waits = on
deadlock_timeout = '1s'
log_min_duration_statement = 250
log_checkpoints = on
