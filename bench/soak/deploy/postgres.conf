# PostgreSQL 17/18 production-representative configuration for Ruxbase W11-05 168-hour staging soak.
# Sized for a dedicated staging VPS (recommended >= 4 vCPU, 8 GiB RAM, >= 100 GB SSD).
# Adjust shared_buffers / effective_cache_size in an override file if staging RAM differs.

listen_addresses = '*'
max_connections = 200

# Memory
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 8MB
maintenance_work_mem = 256MB

# WAL & Logical Replication (hard-bounded to prevent uncontrolled WAL disk growth)
wal_level = logical
max_replication_slots = 10
max_wal_senders = 10
max_slot_wal_keep_size = 1GB
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9
wal_compression = lz4

# Autovacuum tuning for sustained 7-day write/update/delete activity
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
log_autovacuum_min_duration = 1000

# Planner & I/O
random_page_cost = 1.1
effective_io_concurrency = 100

# Observability & Contention Diagnostics
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = all
track_io_timing = on
track_activities = on
track_counts = on
log_lock_waits = on
deadlock_timeout = '1s'
log_min_duration_statement = 250
log_checkpoints = on
log_connections = off
log_disconnections = off
