name: docs-quickstart
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '25.2.1'
      - name: Build dashboard assets
        run: npm --prefix ui ci && npm --prefix ui run build
      - name: Run documented development startup
        run: python3 website/scripts/check-quickstart.py

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '25.2.1'
      - name: Verify Docker Compose is available
        run: |
          docker version
          docker compose version
      - name: Build dashboard assets for the Docker image
        run: npm --prefix ui ci && npm --prefix ui run build
      - name: Exercise full Docker Compose Quickstart
        env:
          RUXBASE_COMPOSE_CI: '1'
        run: python3 scripts/check-docs-compose.py
