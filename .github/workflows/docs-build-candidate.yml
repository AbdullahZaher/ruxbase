name: docs-build-candidate
on:
  pull_request:
    paths:
      - 'website/**'
      - 'assets/brand/**'
      - 'docs/**'
      - '.github/workflows/docs-build-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '25.2.1'
      - name: Validate committed registry lockfile
        working-directory: website
        run: node scripts/inspect-lock.mjs
      - name: Install from resolved lockfile
        working-directory: website
        run: npm ci --no-audit --no-fund
      - name: Check production dependency advisories (high or critical)
        working-directory: website
        run: npm audit --omit=dev --audit-level=high
      - name: Test and build
        working-directory: website
        run: |
          npm run test:foundation
          npm run build
          node scripts/check-build.mjs
      - name: Retain development site artifact (not deployed)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: docs-development-candidate
          path: website/dist
          if-no-files-found: error
