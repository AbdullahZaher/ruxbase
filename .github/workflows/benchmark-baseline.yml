name: benchmark baseline

on:
  pull_request:
    paths:
      - 'bench/**'
      - '.github/workflows/benchmark-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruxbase-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BENCH_TARGETS: ruxbase
      BENCH_DURATION: 8s
      BENCH_CONCURRENCY: '8'
      BENCH_RUNS: '1'
      BENCH_RECORDS: '1000'
      BENCH_CLIENTS: '20'
      BENCH_EVENTS: '20'
      BENCH_RATE: '5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.4'
      - name: Record environment
        run: |
          results_dir=$(mktemp -d "$RUNNER_TEMP/ruxbase-benchmark.XXXXXX")
          echo "BENCH_RESULTS_DIR=$results_dir" >> "$GITHUB_ENV"
          {
            git rev-parse HEAD
            go version
            uname -a
            lscpu
            free -h
            docker version
            docker compose version
          } > "$results_dir/ci-environment.txt"
      - name: Run disposable Ruxbase workload
        run: |
          bash -n bench/run.sh
          touch "$BENCH_RESULTS_DIR/.ci-start"
          bash bench/run.sh
      - name: Check fresh measurement evidence
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          root = Path(os.environ["BENCH_RESULTS_DIR"])
          start = (root / ".ci-start").stat().st_mtime
          files = [p for p in root.glob("*.jsonl") if p.stat().st_mtime >= start]
          results = [p for p in files if not p.name.endswith(".resources.jsonl")]
          samples = [p for p in files if p.name.endswith(".resources.jsonl")]
          assert len(results) == len(samples) == 1, (results, samples)
          profile = results[0].with_suffix(".environment.txt")
          assert profile.stat().st_mtime >= start
          profile_lines = profile.read_text().splitlines()
          for name, ref in (("sourceCommit", "HEAD"), ("sourceTree", "HEAD^{tree}")):
              expected = subprocess.check_output(["git", "rev-parse", ref], text=True).strip()
              assert f"{name}={expected}" in profile_lines
          assert {
              "sourceClean=true", "targets=ruxbase", "duration=8s", "concurrency=8",
              "runs=1", "records=1000", "clients=20", "events=20", "rate=5",
              "wal_level=logical", "shared_buffers=1GB",
          }.issubset(profile_lines)
          assert any(re.fullmatch(r"cgroupDriver=(cgroupfs|systemd) cgroupVersion=[12]", line)
                     for line in profile_lines), "Docker must attribute stats to container cgroups"
          assert any(line.startswith("server_version=18.") for line in profile_lines)
          containers = [line for line in profile_lines if line.startswith("container=")]
          assert len(containers) == 3, containers
          for line in containers:
              assert re.search(r"image=\S+@sha256:[a-f0-9]{64} imageID=sha256:[a-f0-9]{64}", line), line

          def load(path):
              return [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          rows = load(results[0])
          assert len(rows) == 3, rows
          assert {r["scenario"] for r in rows} == {"reads", "writes", "realtime"}
          for row in rows:
              assert row["target"] == "ruxbase"
              assert row["errors"] == 0, row
              if row["scenario"] != "realtime":
                  assert row["requests"] > 0 and row["rps"] > 0, row
              else:
                  assert row.get("missing", 0) == 0, row
                  assert row["delivered"] == 400, row
          stats = load(samples[0])
          expected = {"idle", "reads-c8-run1", "writes-c8-run1", "realtime"}
          assert {s["phase"] for s in stats} == expected
          for phase in expected:
              records = [s for s in stats if s["phase"] == phase]
              assert len(records) == 2, records
              assert len({s["stats"]["ID"] for s in records}) == 2
          print(json.dumps(rows, indent=2))
          print(json.dumps(stats, indent=2))
          PY
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ruxbase-benchmark-smoke
          path: ${{ env.BENCH_RESULTS_DIR }}/*
          if-no-files-found: error
          retention-days: 14
