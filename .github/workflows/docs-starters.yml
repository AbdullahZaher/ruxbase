name: docs-starters
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  starter-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '25.2.1'
      - name: Verify starter lockfile graph and registry integrity
        run: node scripts/check-starter-locks.mjs
      - name: Validate AI scaffolding contracts and safe inputs
        run: node --test scripts/test-create-ruxbase-app.mjs
      - name: Test AI evaluation safety without external model credentials
        run: node --test scripts/test-ai-project-eval.mjs
      - name: Compile browser acceptance and Python orchestration
        run: |
          node --check scripts/check-starter-browser.mjs
          node --check scripts/create-ruxbase-app.mjs
          python3 -m py_compile scripts/test-starters-e2e.py scripts/check-nextjs-session.py
          docker version
          docker compose version
          google-chrome --version
      - name: Build embedded dashboard assets for real backend
        run: npm --prefix ui ci --no-audit --no-fund && npm --prefix ui run build
      - name: Build generated React and Next.js, exercise real Ruxbase API, browser and Compose overlays
        env:
          RUXBASE_STARTER_E2E: '1'
          CHROME_BIN: google-chrome
          DOCS_BROWSER_NO_SANDBOX: '1'
        run: python3 scripts/test-starters-e2e.py
