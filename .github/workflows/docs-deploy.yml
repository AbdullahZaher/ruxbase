name: docs-deploy
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Reviewed main commit (full SHA)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ruxbase-docs-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 15
    outputs:
      manifest_sha256: ${{ steps.seal.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Confirm reviewed source
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '25.2.1'
      - name: Confirm all seven exact-main CI workflows passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node website/scripts/check-main-ci.mjs
      - name: Stage verified test-only accessibility scanner
        run: bash website/scripts/stage-axe.sh "$RUNNER_TEMP/docs-axe.min.js"
      - name: Build and validate development documentation
        working-directory: website
        env:
          CHROME_BIN: google-chrome
          DOCS_BROWSER_NO_SANDBOX: '1'
          DOCS_AXE_FILE: ${{ runner.temp }}/docs-axe.min.js
        run: |
          node scripts/inspect-lock.mjs
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run test:foundation
          npm run test:ai
          npm run build
          node scripts/check-build.mjs
          node scripts/check-ai.mjs
          npm run test:retrieval
          bash scripts/validate-openapi.sh
          node scripts/check-publication-scope.mjs
          python3 tests/test-recover-docs-snapshot.py
          python3 scripts/rehearse-docs-recovery.py
          node scripts/browser-smoke.mjs
          bash scripts/run-lighthouse.sh
      - name: Verify exact build before upload
        id: seal
        working-directory: website
        run: |
          node scripts/release-artifact.mjs verify "$GITHUB_SHA"
          echo "sha256=$(sha256sum dist/artifact-manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Retain reviewed snapshot for recovery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: docs-reviewed-snapshot
          path: website/dist
          retention-days: 30
          if-no-files-found: error
      - name: Upload reviewed Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: website/dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Verify published source and core files
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, time, hashlib
          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          expected = os.environ['EXPECTED_COMMIT']
          if base != 'https://abdullahzaher.github.io/ruxbase/':
              raise SystemExit('Unexpected Pages URL: ' + base)
          def get(path):
              with urllib.request.urlopen(base + path, timeout=15) as response:
                  return response.read()
          for attempt in range(12):
              try:
                  raw = get('artifact-manifest.json')
                  assert hashlib.sha256(raw).hexdigest() == os.environ['EXPECTED_MANIFEST_SHA256']
                  manifest = json.loads(raw)
                  assert manifest['sourceCommit'] == expected
                  files = {f['path']: f for f in manifest['files']}
                  for name in ['index.html', 'version.json', 'versions.json', 'llms.txt', 'reference/api.md', 'openapi.json', 'pagefind/pagefind.js', 'sitemap-index.xml']:
                      data = get(name)
                      assert len(data) == files[name]['bytes'] and hashlib.sha256(data).hexdigest() == files[name]['sha256'], name
                  ver = json.loads(get('version.json'))
                  assert ver['sourceCommit'] == expected and ver['documentationStatus'] == 'development' and not ver['dirty']
                  assert b'Ruxbase' in get('')
                  assert b'Ruxbase' in get('llms.txt')
                  assert b'GET /api/health' in get('reference/api.md')
                  assert json.loads(get('openapi.json'))['openapi'] == '3.1.0'
                  assert all(not f.startswith('api-viewer/') for f in files)
                  assert get('pagefind/pagefind.js')
                  assert get('sitemap-index.xml')
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(5)
          print('Published development documentation source and smoke checks verified.')
          PY
