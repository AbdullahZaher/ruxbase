name: upstream inventory

on:
  pull_request:
    paths:
      - 'scripts/*upstream_inventory.py'
      - 'UPSTREAM.lock.json'
      - '.github/workflows/upstream-inventory.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test inventory logic
        run: python3 -m unittest discover -s scripts -p test_upstream_inventory.py
      - name: Verify official reference and inventory divergence
        run: python3 scripts/upstream_inventory.py --output evidence/upstream-inventory.json
      - name: Publish read-only evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pocketbase-upstream-inventory
          path: evidence/upstream-inventory.json
          if-no-files-found: error
          retention-days: 30
