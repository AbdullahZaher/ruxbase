name: docs-foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # existing project pin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # existing project pin
        with:
          node-version: '25.2.1'
      - name: Test documentation foundation
        run: node --test website/tests/*.test.mjs
      - name: Verify originals and stage public sources
        run: node website/scripts/prepare.mjs
