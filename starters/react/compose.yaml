# Overlay for root compose.yaml. Run from repository root:
# docker compose --env-file .env.quickstart -f compose.yaml -f starters/react/compose.yaml up -d --build --wait react
services:
  react:
    image: node:25.2.1-bookworm-slim
    working_dir: /workspace
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev"]
    environment:
      RUXBASE_INTERNAL_URL: http://ruxbase:8090
    volumes:
      - ./starters/react:/workspace
      - react_modules:/workspace/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      ruxbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:5173/\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 8s
      timeout: 4s
      retries: 35
      start_period: 60s
volumes:
  react_modules:
